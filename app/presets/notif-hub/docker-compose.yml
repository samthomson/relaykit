# Routing is configured via Dokploy's Domains API (domain.create), not Traefik labels in this file.
# Service must be on dokploy-network so Traefik can reach it (Dokploy requirement).
#
# Image is published by .github/workflows/image.yml on push to master. For local dev, build the
# same tag from your checkout and compose will use it without pulling:
#   docker build -t ghcr.io/samthomson/relaykit-notif-hub:latest -f app/apps/notif-hub/Dockerfile .
services:
  notif-hub:
    image: ghcr.io/samthomson/relaykit-notif-hub:${NOTIF_HUB_IMAGE_TAG:-latest}
    # :latest moves on every master push; without this, redeploys reuse the stale local image.
    # local dev (locally built tag): set NOTIF_HUB_PULL_POLICY=missing so the local build is used.
    pull_policy: ${NOTIF_HUB_PULL_POLICY:-always}
    restart: unless-stopped
    environment:
      # vapid contact subject for web push; push services reject bogus TLDs (apple: 403 BadJwtToken)
      VAPID_SUBJECT: https://${NOTIF_DOMAIN}
      # the bundled ntfy server below is the default delivery server for the ntfy channel
      NTFY_DEFAULT_SERVER: https://${NTFY_DOMAIN}
    volumes:
      # holds config, rules, devices, vapid keys, and the notification log
      - notif_hub_data_{{DEPLOY_SUFFIX}}:/data
    expose:
      - "3200"
    networks:
      - dokploy-network

  # Self-hosted ntfy: the google-free push channel. The ntfy android app holds its own
  # connection to this server, so pushes work on grapheneos without any play services.
  ntfy:
    image: binwiederhier/ntfy:latest
    pull_policy: always
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: https://${NTFY_DOMAIN}
      NTFY_BEHIND_PROXY: "true"
      # cache lets subscribers catch up on messages published while they were offline
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
    volumes:
      - ntfy_cache_{{DEPLOY_SUFFIX}}:/var/cache/ntfy
    expose:
      - "80"
    networks:
      - dokploy-network

volumes:
  notif_hub_data_{{DEPLOY_SUFFIX}}:
  ntfy_cache_{{DEPLOY_SUFFIX}}:

networks:
  dokploy-network:
    external: true
